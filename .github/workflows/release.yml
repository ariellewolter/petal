name: Release (macOS)

on:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    # Align with GitHub Actions migration to Node.js 24 (see GitHub changelog 2025-09-19).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify macOS app icon
        run: |
          test -f build/icon.icns || (echo "Missing build/icon.icns — run npm run build:icons and commit it" && exit 1)
          ls -la build/icon.icns

      - name: Debug notarize env (safe)
        run: |
          echo "APPLE_ID is set? -> $([[ -n '${APPLE_ID}' ]] && echo yes || echo no)"
          echo "APPLE_TEAM_ID length -> ${#APPLE_TEAM_ID}"
          echo "CSC_KEY_PASSWORD length -> ${#CSC_KEY_PASSWORD}"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build mac artifacts (signed + notarized)
        run: npm run build:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify dist contents
        run: ls -la dist

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
