name: Release (macOS)

on:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recreate the .p12 file from the base64 secret
      - name: Decode signing certificate
        run: |
          echo "$CSC_LINK" | base64 --decode > developerID.p12
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      # Build + sign + notarize
      # electron-builder will:
      # - import cert (via CSC_LINK/CSC_KEY_PASSWORD)
      # - sign
      # - notarize (via APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID)
      - name: Build mac artifacts (signed + notarized)
        run: npm run build:mac -- --publish never
        env:
          CSC_LINK: developerID.p12
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify dist contents
        run: ls -la dist

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
